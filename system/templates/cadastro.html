{% load static %}
<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Cadastro - ADOWES</title>
  <link rel="stylesheet" href="{% static 'style.css' %}">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  
  <style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  font-family: 'Inter', sans-serif;
  background: linear-gradient(135deg, #0a0a0a 0%, #1a1a2e 50%, #16213e 100%);
  min-height: 100vh;
  color: white;
  position: relative;
  overflow-x: hidden;
}


body::before {
  content: '';
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  background: 
    radial-gradient(circle at 20% 80%, rgba(120, 119, 198, 0.1) 0%, transparent 50%),
    radial-gradient(circle at 80% 20%, rgba(255, 0, 87, 0.1) 0%, transparent 50%),
    radial-gradient(circle at 40% 40%, rgba(37, 117, 252, 0.1) 0%, transparent 50%);
  z-index: -1;
  animation: float 20s ease-in-out infinite;
}

@keyframes float {
  0%, 100% { transform: translateY(0px) rotate(0deg); }
  33% { transform: translateY(-20px) rotate(1deg); }
  66% { transform: translateY(10px) rotate(-1deg); }
}

.form-container {
  background: rgba(17, 17, 17, 0.95);
  backdrop-filter: blur(20px);
  border: 1px solid rgba(255, 255, 255, 0.1);
  padding: 50px;
  border-radius: 24px;
  box-shadow: 
    0 20px 60px rgba(0, 0, 0, 0.5),
    0 0 0 1px rgba(255, 255, 255, 0.05),
    inset 0 1px 0 rgba(255, 255, 255, 0.1);
  width: 90%;
  max-width: 520px;
  margin: 40px auto;
  position: relative;
  transition: transform 0.3s ease;
}

.form-container::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, #ff0057, #ff9900, #6a11cb, #2575fc);
  border-radius: 24px 24px 0 0;
}

.form-container:hover {
  transform: translateY(-5px);
}

.form-container h2 {
  text-align: center;
  font-size: 2.2rem;
  font-weight: 700;
  margin-bottom: 40px;
  background: linear-gradient(135deg, #ff0057, #ff9900, #6a11cb);
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-size: 200% 200%;
  animation: gradientShift 3s ease infinite;
  letter-spacing: -0.5px;
}

@keyframes gradientShift {
  0%, 100% { background-position: 0% 50%; }
  50% { background-position: 100% 50%; }
}

form div {
  margin-bottom: 24px;
  display: flex;
  flex-direction: column;
}

form label {
  margin-bottom: 8px;
  font-weight: 500;
  font-size: 0.9rem;
  color: #e0e0e0;
  letter-spacing: 0.3px;
  display: flex;
  align-items: center;
  gap: 6px;
}

form label::before {
  content: '';
  width: 4px;
  height: 4px;
  background: linear-gradient(45deg, #ff0057, #6a11cb);
  border-radius: 50%;
  opacity: 0.7;
}

form input,
form select {
  width: 100%;
  padding: 16px 20px;
  background: rgba(30, 30, 30, 0.8);
  backdrop-filter: blur(10px);
  border: 2px solid rgba(255, 255, 255, 0.1);
  border-radius: 16px;
  color: white;
  font-size: 1rem;
  font-weight: 400;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  font-family: 'Inter', sans-serif;
  position: relative;
}

form input::placeholder {
  color: rgba(255, 255, 255, 0.4);
  font-style: normal;
  font-weight: 300;
}

form input:focus,
form select:focus {
  outline: none;
  border-color: #ff0057;
  background: rgba(30, 30, 30, 0.95);
  box-shadow: 
    0 0 0 4px rgba(255, 0, 87, 0.1),
    0 8px 32px rgba(255, 0, 87, 0.15);
  transform: translateY(-2px);
}

.campo {
  position: relative;
}

.campo select {
  appearance: none;
  background-image: url("data:image/svg+xml,%3csvg xmlns='http://www.w3.org/2000/svg' fill='none' viewBox='0 0 20 20'%3e%3cpath stroke='%23999' stroke-linecap='round' stroke-linejoin='round' stroke-width='1.5' d='m6 8 4 4 4-4'/%3e%3c/svg%3e");
  background-position: right 16px center;
  background-repeat: no-repeat;
  background-size: 16px;
  padding-right: 50px;
}

.btn-cadastro {
  display: block;
  width: 100%;
  padding: 18px;
  font-size: 1.1rem;
  font-weight: 600;
  color: white;
  background: linear-gradient(135deg, #6a11cb 0%, #2575fc 100%);
  border: none;
  border-radius: 16px;
  box-shadow: 
    0 8px 32px rgba(106, 17, 203, 0.3),
    0 0 0 1px rgba(255, 255, 255, 0.1);
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  cursor: pointer;
  text-align: center;
  margin-top: 30px;
  position: relative;
  overflow: hidden;
  letter-spacing: 0.5px;
}

.btn-cadastro::before {
  content: '';
  position: absolute;
  top: 0;
  left: -100%;
  width: 100%;
  height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.2), transparent);
  transition: left 0.5s;
}

.btn-cadastro:hover {
  transform: translateY(-3px);
  box-shadow: 
    0 12px 40px rgba(106, 17, 203, 0.4),
    0 0 0 1px rgba(255, 255, 255, 0.15);
  background: linear-gradient(135deg, #2575fc 0%, #6a11cb 100%);
}

.btn-cadastro:hover::before {
  left: 100%;
}

.btn-cadastro:active {
  transform: translateY(-1px);
}

.form-error {
  color: #ff6b6b;
  font-size: 0.9rem;
  margin-top: 12px;
  text-align: center;
  background: rgba(255, 107, 107, 0.1);
  padding: 12px 16px;
  border-radius: 12px;
  border: 1px solid rgba(255, 107, 107, 0.2);
  font-weight: 500;
}

.btn-voltar {
  display: inline-flex;
  align-items: center;
  gap: 8px;
  margin: 20px 40px;
  color: #ff0057;
  font-weight: 600;
  text-decoration: none;
  font-size: 1rem;
  background: rgba(255, 0, 87, 0.1);
  border: 2px solid rgba(255, 0, 87, 0.3);
  padding: 12px 24px;
  border-radius: 50px;
  transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
  backdrop-filter: blur(10px);
}

.btn-voltar:hover {
  background: #ff0057;
  color: white;
  transform: translateX(-5px);
  box-shadow: 0 8px 32px rgba(255, 0, 87, 0.3);
}

.voltar-wrapper {
  text-align: center;
  margin-top: 30px;
}

.input-container {
  margin-bottom: 20px;
  position: relative;
}

.mensagem {
  margin-top: 8px;
  font-size: 13px;
  font-weight: 500;
  display: block;
  transition: all 0.3s;
  padding: 6px 12px;
  border-radius: 8px;
  letter-spacing: 0.2px;
}

.mensagem.dica {
  color: #74c0fc;
  background: rgba(116, 192, 252, 0.1);
  border: 1px solid rgba(116, 192, 252, 0.2);
}

.mensagem.erro {
  color: #ff6b6b;
  background: rgba(255, 107, 107, 0.1);
  border: 1px solid rgba(255, 107, 107, 0.2);
}

.mensagem.sucesso {
  color: #51cf66;
  background: rgba(81, 207, 102, 0.1);
  border: 1px solid rgba(81, 207, 102, 0.2);
}

.senha-wrapper {
  position: relative;
}

.senha-wrapper input {
  padding-right: 50px;
}

.toggle-password {
  position: absolute;
  right: 16px;
  top: 50%;
  transform: translateY(-50%);
  background: none;
  border: none;
  cursor: pointer;
  font-size: 1.2rem;
  padding: 4px;
  border-radius: 8px;
  transition: all 0.2s;
  color: rgba(255, 255, 255, 0.6);
}

.toggle-password:hover {
  background: rgba(255, 255, 255, 0.1);
  color: rgba(255, 255, 255, 0.9);
}


@keyframes slideInUp {
  from {
    opacity: 0;
    transform: translateY(30px);
  }
  to {
    opacity: 1;
    transform: translateY(0);
  }
}

.form-container {
  animation: slideInUp 0.6s ease-out;
}

.input-container {
  animation: slideInUp 0.6s ease-out;
  animation-fill-mode: both;
}

.input-container:nth-child(1) { animation-delay: 0.1s; }
.input-container:nth-child(2) { animation-delay: 0.15s; }
.input-container:nth-child(3) { animation-delay: 0.2s; }
.input-container:nth-child(4) { animation-delay: 0.25s; }
.input-container:nth-child(5) { animation-delay: 0.3s; }
.input-container:nth-child(6) { animation-delay: 0.35s; }
.input-container:nth-child(7) { animation-delay: 0.4s; }
.input-container:nth-child(8) { animation-delay: 0.45s; }


@media (max-width: 768px) {
  .form-container {
    padding: 30px 20px;
    margin: 20px auto;
    border-radius: 20px;
  }
  
  .form-container h2 {
    font-size: 1.8rem;
    margin-bottom: 30px;
  }
  
  form input,
  form select {
    padding: 14px 16px;
    font-size: 0.95rem;
  }
  
  .btn-cadastro {
    padding: 16px;
    font-size: 1rem;
  }
}


.btn-cadastro.loading {
  pointer-events: none;
  position: relative;
  color: transparent;
}

.btn-cadastro.loading::after {
  content: '';
  position: absolute;
  width: 20px;
  height: 20px;
  top: 50%;
  left: 50%;
  margin-left: -10px;
  margin-top: -10px;
  border: 2px solid #ffffff;
  border-radius: 50%;
  border-top-color: transparent;
  animation: spin 1s linear infinite;
}

@keyframes spin {
  to { transform: rotate(360deg); }
}
  </style>
</head>
<body>  
    
{% include 'navbar.html' %}

<div class="voltar-wrapper">
  <a href="/" class="btn-voltar">
    <span>←</span>
    Voltar para o início
  </a>
</div>

<div class="form-container">
  <h2>Cadastro de Adolescente</h2>

  {% if messages %}
    <div>
      {% for message in messages %}
        <p class="form-error">{{ message }}</p>
      {% endfor %}
    </div>
  {% endif %}

  <form id="formulario" method="POST" action="{% url 'cadastro' %}">
    {% csrf_token %}
    
    
    <div class="input-container">
      <label for="username">Nome de Usuário:</label>
      <input type="text" id="username" name="username" required placeholder="Um usuário bem criativo">
      <div id="mensagem-nome" class="mensagem"></div>
    </div>

    
    <div class="input-container">
      <label for="nome">Nome Completo:</label>
      <input type="text" id="nome" name="nome" required placeholder="Seu nome completo">
      <div id="mensagem-email" class="mensagem"></div>
    </div>

    
    <div class="input-container">
      <label for="telefone">Telefone:</label>
      <input type="tel" id="telefone" name="telefone" required placeholder="(99) 99999-9999">
      <div id="mensagem-telefone" class="mensagem"></div>
    </div>

   
    <div class="campo">
      <label for="genero">Gênero:</label>
      <select name="genero" id="genero" required>
        <option value="">Selecione seu gênero</option>
        <option value="M">Masculino</option>
        <option value="F">Feminino</option>
      </select>
      <span id="mensagem-genero" class="mensagem"></span>
    </div>

  
    <div class="campo">
      <label for="time">Time:</label>
      <select name="time" id="time" required>
        <option value="">Selecione seu time</option>
        <option value="Azul">Time Azul</option>
        <option value="Roxo">Time Roxo</option>
      </select>
      <span id="mensagem-time" class="mensagem"></span>
    </div>

   
    <div class="input-container">
      <label for="data_nascimento">Data de Nascimento:</label>
      <input type="text" name="data_nascimento" id="data_nascimento" placeholder="DD/MM/AAAA" required>
      <div id="mensagem-data" class="mensagem"></div>
    </div>

   
    <div class="input-container">
      <label for="senha">Senha:</label>
      <div class="senha-wrapper">
        <input type="password" id="senha" name="password" required placeholder="Crie uma senha segura">
        <button type="button" class="toggle-password" onclick="togglePassword('senha', this)">👁️</button>
      </div>
      <div id="mensagem-senha" class="mensagem"></div>
    </div>

   
    <div class="input-container">
      <label for="confirmar_senha">Confirmar Senha:</label>
      <div class="senha-wrapper">
        <input type="password" id="confirmar_senha" name="confirm_password" required placeholder="Repita sua senha">
        <button type="button" class="toggle-password" onclick="togglePassword('confirmar_senha', this)">👁️</button>
      </div>
      <div id="mensagem-confirmar" class="mensagem"></div>
    </div>

    <button type="submit" class="btn-cadastro">Criar Conta</button>
    
    {% if form_error %}
      <p class="form-error">{{ form_error }}</p>
    {% endif %}
  </form>
</div>

<script>
function formatPhoneInput(inputId) {
  const input = document.getElementById(inputId);
  
  input.addEventListener('input', function(e) {
    let value = e.target.value.replace(/\D/g, '');
    let formatted = '';
    
    if (value.length > 0) {
      formatted += '(' + value.substring(0, Math.min(2, value.length));
    }

    if (value.length > 2) {
      formatted += ') ' + value.substring(2, Math.min(7, value.length));
    }

    if (value.length > 7) {
      formatted += '-' + value.substring(7, Math.min(11, value.length));
    }

    e.target.value = formatted;
  });
}

function togglePassword(id, btn) {
  const input = document.getElementById(id);
  if (input.type === "password") {
    input.type = "text";
    btn.textContent = "🙈";
  } else {
    input.type = "password";
    btn.textContent = "👁️";
  }
}

function formatDateInput(id) {
  const input = document.getElementById(id);
  input.addEventListener('input', function (e) {
    let value = input.value.replace(/\D/g, '');
    if (value.length > 8) value = value.slice(0, 8);

    if (value.length >= 5) {
      value = `${value.slice(0, 2)}/${value.slice(2, 4)}/${value.slice(4)}`;
    } else if (value.length >= 3) {
      value = `${value.slice(0, 2)}/${value.slice(2)}`;
    }

    input.value = value;
  });
}


formatPhoneInput('telefone');
formatDateInput('data_nascimento');

document.addEventListener('DOMContentLoaded', function () {
  const campos = {
    nome: {
      input: document.getElementById('nome'),
      msg: document.getElementById('mensagem-nome'),
      dica: "Digite seu nome completo.",
      validar: (v) => v.trim().length >= 3
    },
    email: {
      input: document.getElementById('email'),
      msg: document.getElementById('mensagem-email'),
      dica: "Digite seu nome completo.",
      validar: (v) => v.trim().length >= 3
    },
    telefone: {
      input: document.getElementById('telefone'),
      msg: document.getElementById('mensagem-telefone'),
      dica: "Use o formato (99) 99999-9999.",
      validar: (v) => /^\(\d{2}\)\s?\d{5}-\d{4}$/.test(v)
    },
    genero: {
      input: document.getElementById('genero'),
      msg: document.getElementById('mensagem-genero'),
      dica: "Selecione seu gênero.",
      validar: (v) => v !== ""
    },
    time: {
      input: document.getElementById('time'),
      msg: document.getElementById('mensagem-time'),
      dica: "Selecione seu time.",
      validar: (v) => v === "Azul" || v === "Roxo"
    },
    data_nascimento: {
      input: document.getElementById('data_nascimento'),
      msg: document.getElementById('mensagem-data'),
      dica: "Digite no formato DD/MM/AAAA.",
      validar: (v) => {
        const match = v.match(/^(\d{2})\/(\d{2})\/(\d{4})$/);
        if (!match) return false;
        const [_, dStr, mStr, aStr] = match;
        const d = parseInt(dStr, 10);
        const m = parseInt(mStr, 10);
        const a = parseInt(aStr, 10);

        if (m < 1 || m > 12) return false;

        const diasPorMes = [31, (a % 4 === 0 && (a % 100 !== 0 || a % 400 === 0)) ? 29 : 28, 31, 30, 31, 30, 31, 31, 30, 31, 30, 31];
        if (d < 1 || d > diasPorMes[m - 1]) return false;

        const data = new Date(a, m - 1, d);
        const hoje = new Date();
        hoje.setHours(0, 0, 0, 0);

        return data <= hoje;
      }
    },
    senha: {
      input: document.getElementById('senha'),
      msg: document.getElementById('mensagem-senha'),
      dica: "A senha deve ter pelo menos 6 caracteres.",
      validar: (v) => v.length >= 6
    },
    confirmar_senha: {
      input: document.getElementById('confirmar_senha'),
      msg: document.getElementById('mensagem-confirmar'),
      dica: "Repita a senha corretamente.",
      validar: (v) => v === document.getElementById('senha').value
    }
  };

  Object.entries(campos).forEach(([id, campo]) => {
    if (!campo.input) return;
    
    campo.input.addEventListener('focus', () => {
      mostrarMensagem(campo.msg, campo.dica, "dica");
    });

    campo.input.addEventListener('blur', () => {
      const valor = campo.input.value.trim();
      if (!valor) {
        mostrarMensagem(campo.msg, "Este campo é obrigatório.", "erro");
        campo.input.style.borderColor = "#ff6b6b";
      } else if (!campo.validar(valor)) {
        mostrarMensagem(campo.msg, "Valor inválido. " + campo.dica, "erro");
        campo.input.style.borderColor = "#ff6b6b";
      } else {
        mostrarMensagem(campo.msg, "Campo válido!", "sucesso");
        campo.input.style.borderColor = "#51cf66";
      }
    });
  });

  function mostrarMensagem(el, texto, tipo) {
    if (el) {
      el.textContent = texto;
      el.className = `mensagem ${tipo}`;
    }
  }

  
  document.getElementById("formulario").addEventListener("submit", function (e) {
    let valido = true;
    Object.values(campos).forEach(campo => {
      if (!campo.input) return;
      const valor = campo.input.value.trim();
      if (!valor || !campo.validar(valor)) {
        mostrarMensagem(campo.msg, "Verifique este campo.", "erro");
        campo.input.style.borderColor = "#ff6b6b";
        valido = false;
      }
    });
    
    if (valido) {
      const btn = document.querySelector('.btn-cadastro');
      btn.classList.add('loading');
      btn.textContent = 'Criando conta...';
    } else {
      e.preventDefault();
    }
  });
});
</script>

</body>
</html>
